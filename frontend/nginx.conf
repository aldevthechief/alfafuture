server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker assigns new IPs when API containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # the streamed answers must reach the browser token by token
    location /feedback/ {
        set $feedback_upstream http://feedback-api:8001;
        rewrite ^/feedback/(.*)$ /$1 break;
        proxy_pass $feedback_upstream;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location /v1/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / { try_files $uri /index.html; }
}
