server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the streamed answers must reach the browser token by token
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / { try_files $uri /index.html; }
}
