<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Альфа-Бизнес</title>
<script>
// Apply before first paint; storage can be unavailable in a private browser.
try {
  const saved = localStorage.getItem('alfa-insights-theme');
  document.documentElement.dataset.theme = ['light', 'dark'].includes(saved) ? saved
    : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
} catch { document.documentElement.dataset.theme = 'light'; }
</script>

<!--
  Recreation of the current Alfa-Business web cabinet (2024 light redesign).
  Source: habr.com/ru/companies/alfa/articles/809991, screenshots in reference/.
  Home + our service (src/main.jsx on @alfalab/core-components, data public/feed.json); other sections are stubs.
  Run: npm ci && npm run dev   (static build: npm run build -> dist/)
-->
<style>
:root{
  --red:#EF3124; --red-dark:#D42A1E;
  --bg:#F3F4F5; --card:#FFFFFF; --fill:#EBECEF; --fill-hover:#E2E4E8;
  --text:#0B1F35; --text-2:#5E6C7B; --text-3:#97A0AB; --icon:#86909C;
  --line:#E1E3E6; --blue:#2A77EF; --green:#13A463; --green-bg:#E3F5EA; --purple:#7B61FF;
  --radius:16px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block;flex:0 0 auto}

body.cabinet-locked .app,body.cabinet-locked>.fab,body.cabinet-locked>.chat{display:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:266px;flex:0 0 266px;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  padding:14px 12px 12px;border-right:1px solid var(--line);background:var(--bg);z-index:30;
}
.logo{display:flex;align-items:center;gap:14px;padding:0 0 14px;font-size:19px;font-weight:700;letter-spacing:-.2px}
.logo-mark{position:relative;width:42px;height:42px;border-radius:13px;background:var(--red);display:grid;place-items:center;color:#fff}
.logo-mark svg{transition:opacity .15s,transform .15s}
.logo-mark .home{position:absolute;opacity:0;transform:scale(.6)}
.logo:hover .logo-mark .a{opacity:0;transform:scale(.6)}
.logo:hover .logo-mark .home{opacity:1;transform:none}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.nav-item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:46px;padding:0 12px;
  border-radius:12px;font-size:15px;color:var(--text);position:relative;transition:background .12s;white-space:nowrap;
}
.nav-item svg{color:var(--icon)}
.nav-item:hover{background:var(--fill)}
.nav-item.active{background:var(--fill)}
.nav-item.active::before{content:'';position:absolute;left:-4px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--red)}
.nav-item.primary{background:var(--card);font-weight:500;margin-bottom:6px}
.nav-item.primary svg{color:var(--text)}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:6px}
.nav-caption{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text);font-weight:500}
.nav-caption button{color:var(--icon)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.nav-promo svg{color:var(--icon);border:1.5px dashed #C7CCD3;border-radius:50%;padding:5px;width:34px;height:34px;margin-left:-7px;margin-right:-7px}
.side-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.side-tile{background:var(--card);border-radius:14px;padding:12px;text-align:left;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:10px;min-height:92px}
.side-tile:hover{background:#fff;box-shadow:0 2px 10px rgba(11,31,53,.08)}
.side-old{font-size:13px;color:var(--text-3);padding:12px 12px 0;text-align:left}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 32px 0 24px}
.top-btn.burger{display:none;margin-right:auto}
.top-btn{height:40px;min-width:40px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:8px;color:var(--text)}
.top-btn svg{color:#3B4A5A}
.top-btn:hover{background:var(--fill)}
.top-sep{width:1px;height:28px;background:var(--line);margin:0 10px}
.who{position:relative}
.who-btn{display:flex;align-items:center;gap:12px;padding:4px 10px;border-radius:12px;text-align:left}
.who-btn:hover{background:var(--fill)}
.who-btn b{display:block;font-size:15px;font-weight:600;white-space:nowrap}
.who-btn span{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:320px;background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(11,31,53,.18);padding:8px;display:none;z-index:60}
.menu.open{display:block}
.menu h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:10px 10px 6px}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px}
.menu-item:hover{background:var(--bg)}
.menu-item small{display:block;color:var(--text-3);font-size:12px}
.menu-item .tick{color:var(--red);font-weight:700;visibility:hidden}
.menu-item.on .tick{visibility:visible}

.content{padding:8px 32px 48px 32px;width:100%;max-width:1320px}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border-radius:var(--radius)}
.h-sys{font-size:40px;line-height:48px;font-weight:700;letter-spacing:-.6px;margin:8px 0 6px}
.h-sub{color:var(--text-2);margin-bottom:20px}

/* ---------- home ---------- */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 56px;gap:16px;margin-bottom:16px}
.qtile{min-height:120px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:15px;line-height:1.3}
.qtile:hover{box-shadow:0 2px 12px rgba(11,31,53,.08)}
.qico{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--icon)}
.qside{display:flex;flex-direction:column;gap:12px}
.qside button{flex:1;border:1.5px dashed #9AA3AE;border-radius:14px;display:grid;place-items:center;color:#6B7785}
.qside button.more{border-color:#7FB0FF;color:var(--blue)}
.statuses{display:flex;align-items:center;gap:30px;padding:0 24px;height:60px;margin-bottom:16px;overflow-x:auto;white-space:nowrap}
.statuses button{display:flex;align-items:center;gap:10px;font-size:15.5px}
.statuses button:last-child{margin-left:auto}
.cnt{min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--fill);font-size:14px;font-weight:600;display:grid;place-items:center}
.cnt.red{background:var(--red);color:#fff}

.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:24px;margin-bottom:24px}
.acc{padding:24px 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 32px;align-items:start}
.acc-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.acc-col + .acc-col{border-left:1.5px dashed var(--line);padding-left:32px}
.acc-label{display:flex;align-items:center;gap:8px;color:var(--text)}
.acc-label svg{color:var(--text-3)}
.amount{font-size:34px;line-height:42px;font-weight:700;letter-spacing:-.6px;white-space:nowrap}
.amount .kop{color:#A9B1BA}
.acc-no{display:flex;align-items:center;gap:8px;color:var(--text)}
.acc-no button{color:var(--text-3)}
.tag{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--green-bg);color:var(--green)}
.amount-plus{display:flex;align-items:center;gap:10px}
.amount-plus i{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:18px;line-height:1}
.dep-line{color:var(--text-2);margin-top:14px}
.dep-line b{color:var(--text);font-weight:600}
.chip{align-self:flex-start;margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14.5px}
.chip b{font-weight:600}
.acc-actions{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{height:44px;padding:0 22px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn-gray{background:var(--fill)}
.btn-gray:hover{background:var(--fill-hover)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dark)}
.btn-text{padding:0 8px}

.right{display:flex;flex-direction:column;gap:12px}
.promo{border-radius:14px;padding:14px 16px;min-height:138px;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.promo b{font-size:14.5px}
.promo p{font-size:13.5px;line-height:1.3;max-width:180px}
.promo .art{position:absolute;right:-8px;top:24px;width:70px;height:80px;border-radius:12px;transform:rotate(-8deg)}
.promo:hover{box-shadow:0 2px 12px rgba(11,31,53,.12)}
.promo-card{background:#A9D3F2}
.promo-card .art{background:linear-gradient(135deg,#FF5A47,#D42A1E)}
.promo-bonus{background:#F2C8B3}
.promo-bonus .art{background:linear-gradient(135deg,#9B7BFF,#2BB3C7);border-radius:50%}

.hist{padding:22px 26px 26px}
.hist-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin:0 -10px 20px;padding-left:10px;padding-right:10px}
.hist-head h2{font-size:19px;font-weight:700}
.filters{display:grid;grid-template-columns:370px minmax(0,1fr);gap:16px;margin-bottom:16px}
.field{height:52px;border-radius:12px;background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--text-2)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--text)}
.field .date{flex:1;text-align:center;color:var(--text);font-size:16px}
.chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.fchip{height:36px;padding:0 14px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;gap:6px}
.fchip.on{background:var(--text);color:#fff}
.chips .push{margin-left:auto}
.sums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:12px}
.sum{background:var(--bg);border-radius:12px;padding:14px 16px}
.sum > span{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-2);margin-bottom:6px}
.sum b{font-size:16px;font-weight:600;white-space:nowrap}
.ops{width:100%;border-collapse:collapse}
.ops td{padding:13px 8px;border-top:1px solid var(--line);vertical-align:middle}
.ops td:first-child{padding-left:0;color:var(--text-2);width:90px}
.ops td:last-child{text-align:right;padding-right:0;font-weight:600;white-space:nowrap}
.ops .cp{font-weight:500}
.ops .purpose{font-size:13.5px;color:var(--text-2);display:block}
.ops .in{color:var(--green)}

/* ---------- service page ---------- */
.mount{min-height:420px;padding:24px;border-radius:var(--radius);background:var(--card)}
.mount-empty{border:1.5px dashed #7FB0FF;background:#EEF4FF;border-radius:12px;min-height:372px;display:grid;place-items:center;color:var(--blue);text-align:center;padding:20px}

/* ---------- chat ---------- */
.fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;background:#1C1C1E;color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50}
.fab:hover{background:#000}
.chat{position:fixed;right:24px;bottom:96px;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 120px);background:var(--card);border-radius:20px;box-shadow:0 16px 48px rgba(11,31,53,.22);display:none;flex-direction:column;overflow:hidden;z-index:55}
.chat.open{display:flex}
.chat-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat-head b{font-size:16px}
.chat-head small{display:block;color:var(--text-2);font-size:12.5px}
#chatBody{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bubble{background:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;max-width:88%}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-input input{flex:1;height:44px;border-radius:12px;border:0;background:var(--bg);padding:0 14px;outline:none}

.side-overlay{display:none}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .quick{grid-template-columns:repeat(3,minmax(0,1fr))}
  .quick .qtile:nth-child(n+4),.qside{display:none}
}
@media (max-width:1100px){
  .home-grid{grid-template-columns:1fr}
  .right{flex-direction:row;flex-wrap:wrap}
  .right > *{flex:1 1 260px}
  .filters{grid-template-columns:1fr}
  .sums{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .side{position:fixed;left:0;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.side-open .side{transform:none}
  body.side-open .side-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
  .top-btn.burger{display:flex}
  .top{padding:0 16px}
  .content{padding:8px 16px 96px}
  .top-hide,.top-sep{display:none}
  .acc{grid-template-columns:1fr}
  .acc-col + .acc-col{border-left:0;padding-left:0;border-top:1.5px dashed var(--line);padding-top:16px;margin-top:16px}
}
@media (max-width:600px){
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick .qtile:nth-child(3){display:none}
  .who-btn span{display:none}
  .amount{font-size:28px}
  .sums{grid-template-columns:1fr}
  .ops td:nth-child(1){display:none}
  .h-sys{font-size:30px;line-height:36px}
}
</style>
</head>

      <button class="nav-item" data-view="stub" data-title="Документооборот"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 2h9l5 5v6.5h-5V19H5z"/><path d="M15 15h3.5v-2l3.5 3.5-3.5 3.5v-2H15z"/></svg>Документооборот</button>

      <button class="nav-item nav-promo" data-view="stub" data-title="Управление ликвидностью"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>Управление ликвидностью</button>
      <button class="nav-item nav-promo" data-view="stub" data-title="Госзакупки"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 6.5V8h18V6.5zM5 10h2.5v7H5zm5.75 0h2.5v7h-2.5zM16.5 10H19v7h-2.5zM3 19h18v2.5H3z"/></svg>Госзакупки</button>
    </nav>
    <div class="side-tiles">
      <button class="side-tile" data-view="stub" data-title="Все сервисы и продукты"><svg width="22" height="22" viewBox="0 0 24 24" fill="var(--blue)"><path d="M2 3h3.2l.7 3H21l-2.2 8H7.6l.5 2H19v2.5H6.2L3.3 5.5H2z"/><circle cx="8.5" cy="20.8" r="1.6"/><circle cx="17" cy="20.8" r="1.6"/></svg>Все сервисы и&nbsp;продукты</button>
      <button class="side-tile" data-view="stub" data-title="Кэшбэк и привилегии"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--purple)"/><path d="M12 6.5 8.3 15.5h2l.7-1.8h2l.7 1.8h2zm-.5 5.6.5-1.5.5 1.5z" fill="#fff"/></svg>Кэшбэк и&nbsp;привилегии</button>

    <button class="side-old" data-view="stub" data-title="Предыдущая версия">Предыдущая версия</button>
  </aside>
  <div class="side-overlay" id="sideOverlay"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="top">
      <span id="theme-toggle"></span>
      <button class="top-btn burger" id="burger" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="top-btn top-hide" data-view="stub" data-title="Поиск"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>Поиск</button>
      <span class="top-sep"></span>
      <button class="top-btn top-hide" aria-label="Календарь" data-view="stub" data-title="Календарь"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1z"/><path d="M5 9h14v2H5z" fill="#fff"/><path d="M7 13h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2zm-8 3.5h2v2H7zm4 0h2v2h-2z" fill="#fff"/></svg></button>
      <button class="top-btn top-hide" aria-label="Письма" data-view="stub" data-title="Письма"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 6.5A2.5 2.5 0 0 1 4.5 4h15A2.5 2.5 0 0 1 22 6.5v.3l-10 6-10-6z"/><path d="M2 9.2l10 6 10-6v8.3a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.5z"/></svg></button>
      <button class="top-btn" aria-label="Уведомления" data-view="stub" data-title="Уведомления"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a6.5 6.5 0 0 0-6.5 6.5v4.2L3.6 16.6c-.4.7.1 1.4.9 1.4h15c.8 0 1.3-.7.9-1.4l-1.9-3.4V9A6.5 6.5 0 0 0 12 2.5zM9.4 19.5a2.7 2.7 0 0 0 5.2 0z"/></svg></button>
      <span class="top-sep"></span>
      <div class="who">
        <button class="who-btn" id="whoBtn" title="Выбрать компанию и должность" aria-haspopup="menu" aria-expanded="false" aria-controls="company-switcher">
          <span><b id="whoCompany"></b><span id="whoUser"></span></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#3B4A5A" aria-hidden="true"><path d="M9 3h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v4.3a6 6 0 0 0-9.7 7.7H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 2v1h6V5z"/><circle cx="18" cy="17.5" r="3.2"/><circle cx="18" cy="17.5" r="1.2" fill="#fff"/></svg>
        </button>
        <span id="company-switcher"></span>
      </div>
      <span class="top-sep"></span>
      <button class="top-btn top-hide" aria-label="Выйти" id="cabinetLogout"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h9v18H4z"/><path d="M15 4.5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3v-2h3v-11h-3z"/><circle cx="10.5" cy="12" r="1.2" fill="#fff"/></svg></button>
    </header>

    <main class="content">

      <!-- ===== HOME ===== -->
      <section class="view active" id="view-home">
        <div class="quick" id="quick"></div>

        <div class="card statuses" id="statuses"></div>
        <div id="insights-widget"></div>

        <div class="home-grid">
          <div class="card acc">
            <div class="acc-col">
              <div class="acc-label">Рублёвый счёт <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4 20 8.5 9 19.5H4.5V15z"/></svg></div>
              <div class="amount num" id="accAmount"></div>
              <div class="acc-no num"><span id="accNo"></span><button aria-label="Скопировать номер счёта" id="copyNo"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h11v13h-3V6H8z"/><path d="M4 8h11v13H4z"/></svg></button></div>
              <span class="chip num">Свои деньги:&nbsp;<b id="ownMoney"></b></span>
            </div>
            <div class="acc-col">
              <span class="tag">Кредитная линия</span>
              <div class="amount num amount-plus"><i>+</i><span id="creditAmount"></span></div>
              <div id="creditNote" style="color:var(--text)"></div>
              <div class="dep-line num" id="depLine"></div>
            </div>
            <div class="acc-actions">
              <button class="btn btn-gray" id="copyReq">Скопировать реквизиты</button>
              <span>Обслуживание «Корпоративный»</span>
            </div>
          </div>

          <div class="right">
            <button class="promo promo-card" data-view="stub" data-title="Карты">
              <b>Закажите карту</b>
              <p>До 5% кэшбэк. Карта будет доступна уже через 60&nbsp;секунд</p>
              <span class="art"></span>
            </button>
            <button class="promo promo-bonus" data-view="stub" data-title="Кэшбэк и привилегии">
              <b>Деньги сверху</b>
              <p>Получайте бонусные баллы за привычные операции</p>
              <span class="art"></span>
            </button>
          </div>
        </div>

        <div class="card hist">
          <div class="hist-head"><h2>История операций</h2><svg width="18" height="18" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="filters">
            <div class="field"><svg width="18" height="18" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="date">Сегодня</span><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zM5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9z"/></svg></div>
            <label class="field"><input id="opsSearch" placeholder="Название контрагента, ИНН или КПП" aria-label="Поиск по операциям"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></label>
          </div>
          <div class="chips">
            <button class="fchip" data-dir="all" aria-pressed="true">Все</button>
            <button class="fchip" data-dir="in" aria-pressed="false">Входящие</button>
            <button class="fchip" data-dir="out" aria-pressed="false">Исходящие</button>
            <button class="fchip">Тип платежа ▾</button>
            <button class="fchip">Сумма ▾</button>
            <button class="btn btn-text push">Скачать ОСВ</button>
            <button class="btn btn-red">Скачать выписку</button>
          </div>
          <div class="sums num" id="sums"></div>
          <table class="ops num"><tbody id="ops"></tbody></table>
        </div>
      </section>

      <!-- ===== OUR SERVICE (rendered by src/main.jsx) ===== -->
      <section class="view" id="view-insights"><div id="insights-page"></div></section>

      <!-- ===== STUB for other sections ===== -->
      <section class="view" id="view-stub">
        <h1 class="h-sys" id="stubTitle"></h1>
        <p class="h-sub">Раздел интернет-банка недоступен в демо-версии.</p>
        <div class="mount"><div class="mount-empty">Content</div></div>
      </section>
    </main>
  </div>
</div>

<!-- chat entry point (part of SharedUI) -->
<button class="fab" id="fab" aria-label="Открыть чат с банком" aria-expanded="false"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M7 9h10v2H7zm0 3.5h6v2H7z" fill="#1C1C1E"/></svg></button>
<div class="chat" id="chat" role="dialog" aria-label="Чат с банком">
  <div class="chat-head"><div><b>Чат с банком</b><small>Ответим в течение нескольких минут</small></div><button id="chatClose" aria-label="Закрыть чат"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
  <div id="chatBody"><div class="bubble">Здравствуйте! Чем можем помочь?</div></div>
  <form class="chat-input" id="chatForm"><input id="chatInput" placeholder="Сообщение" aria-label="Сообщение"><button class="btn btn-red" style="height:44px;padding:0 16px">→</button></form>
</div>

<div id="insights-root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
// demo data: a large-business client and a company of its group
const DEMO = {
  user: 'Смирнов И. В.',
  companies: [
    { id: 'U_19717', name: 'Розничная торговля топливом №19717', note: 'Розничная торговля топливом · Новосибирск', inn: '5407012345', acc: '40702 810 4 0295 0019717', balance: 1284590312.45, own: 384590312.45, credit: 2500000000, creditNote: 'Ключевая ставка + 2,1% · плавающая', deposit: 600000000, depNote: '13,9% годовых · до 15.12.2026' },
    { id: 'U_147819', name: 'Оптовая торговля топливом №147819', note: 'Оптовая торговля топливом · Санкт-Петербург', inn: '7801012345', acc: '40702 810 1 0295 0147819', balance: 643120880.10, own: 643120880.10, credit: 1200000000, creditNote: 'Ключевая ставка + 2,4% · плавающая', deposit: 0, depNote: 'Нет открытых депозитов' },
  ],
  roles: [['owner', 'Собственник'], ['ceo', 'Генеральный директор'], ['cfo', 'Финансовый директор'], ['accountant', 'Главный бухгалтер'], ['treasury', 'Казначейство']],
  statuses: [['Оплатить', 1, true], ['Подписать', 7], ['Отправить', 3], ['Доработать', 1], ['Отклонённые', 0], ['Черновики', 5], ['В работе у банка', 4]],
  quick: ['Платёж по шаблону', 'Сформировать выписку', 'Импорт платежей из 1С', 'Выставить счёт', 'Валютный контроль'],
  ops: [
    ['Сегодня', 'Поставщик дизельного топлива', 'Оплата за ДТ по договору № 118/26', -412800000],
    ['Сегодня', 'Транспортная компания', 'Оплата по топливным картам, сентябрь', 38450000],
    ['Сегодня', 'УФК по Новосибирской области', 'Единый налоговый платёж', -96300000],
    ['Вчера', 'Строительно-монтажная компания', 'Оплата дизельного топлива по счёту 2219', 12740000],
    ['Вчера', 'Оптовая торговля топливом №147819', 'Поставка АИ-95 по договору № 7/26', -184100000],
  ],
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.abs(n).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => { const [r, k] = fmt(n).split(','); return `${r}<span class="kop">,${k}&nbsp;₽</span>`; };
let current = DEMO.companies[0], role = 'cfo';

function showView(view, title) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view && (view !== 'stub' || b.dataset.title === title)));
  if (view === 'stub') $('#stubTitle').textContent = title || '';
  document.body.classList.remove('side-open');
  window.scrollTo(0, 0);
  window.dispatchEvent(new CustomEvent('demo:view', { detail: { view } }));
}
window.showView = showView;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view]');
  if (!t) return;
  e.preventDefault();
  showView(t.dataset.view, t.dataset.title);
});

function renderCompany() {
  const c = current;
  $('#whoCompany').textContent = c.name;
  $('#whoUser').textContent = `${DEMO.user} · ${window.cabinetSession?.role_title || DEMO.roles.find(r => r[0] === role)?.[1] || role}`;
  $('#accAmount').innerHTML = money(c.balance);
  $('#accNo').textContent = c.acc;
  $('#ownMoney').innerHTML = money(c.own);
  $('#creditAmount').innerHTML = money(c.credit);
  $('#creditNote').textContent = c.creditNote;
  $('#depLine').innerHTML = c.deposit ? `Депозит <b>${money(c.deposit)}</b> · ${esc(c.depNote)}` : esc(c.depNote);
  // The entry screen owns company/role selection in both build variants.
  window.demoContext = { ...window.cabinetSession, company_meta:window.cabinetSession?.company, company: c.id, role };
  window.dispatchEvent(new CustomEvent('demo:context', { detail: window.demoContext }));
  renderOps();
}

function renderHome() {
  $('#quick').innerHTML = DEMO.quick.map(q =>
    `<button class="card qtile" data-view="stub" data-title="${esc(q)}"><span class="qico"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 2h9l5 5v15H5z"/></svg></span>${esc(q)}</button>`).join('') +
    `<div class="qside"><button aria-label="Добавить действие"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="more" aria-label="Все действия"><svg width="18" height="18" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>`;
  $('#statuses').innerHTML = DEMO.statuses.map(([t, n, red]) =>
    `<button data-view="stub" data-title="${esc(t)}">${esc(t)} <span class="cnt${red ? ' red' : ''}">${n}</span></button>`).join('');
}

let opsDir = 'all';
function renderOps() {
  const q = $('#opsSearch').value.toLowerCase();
  const rows = DEMO.ops.filter(o => (opsDir === 'all' || (opsDir === 'in') === (o[3] > 0)) && (o[1] + o[2]).toLowerCase().includes(q));
  const inc = rows.filter(o => o[3] > 0).reduce((s, o) => s + o[3], 0), out = rows.filter(o => o[3] < 0).reduce((s, o) => s + o[3], 0);
  $('#sums').innerHTML = [['Входящий остаток', money(current.balance - inc - out)], ['Поступления <span style="color:var(--green)">↑</span>', '+' + money(inc)],
    ['Списания <span style="color:var(--red)">↓</span>', '−' + money(out)], ['Исходящий остаток', money(current.balance)]]
    .map(([l, v]) => `<div class="sum"><span>${l}</span><b>${v}</b></div>`).join('');
  $('#ops').innerHTML = rows.length ? rows.map(([d, cp, p, s]) =>
    `<tr><td>${esc(d)}</td><td><span class="cp">${esc(cp)}</span><span class="purpose">${esc(p)}</span></td><td class="${s > 0 ? 'in' : ''}">${s > 0 ? '+' : '−'}${money(s)}</td></tr>`).join('')
    : `<tr><td colspan="3" style="text-align:center;color:var(--text-3)">Операций не найдено</td></tr>`;
}
document.querySelectorAll('.fchip[data-dir]').forEach(b => b.addEventListener('click', () => {
  opsDir = b.dataset.dir;
  document.querySelectorAll('.fchip[data-dir]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  renderOps();
}));
$('#opsSearch').addEventListener('input', renderOps);

// Switch accounts through the same entry screen, keeping company and reader role together.
$('#whoBtn').addEventListener('click', () => window.dispatchEvent(new Event('cabinet:switcher')));
$('#cabinetLogout').addEventListener('click', () => window.dispatchEvent(new Event('cabinet:logout')));
window.setCabinetContext = session => {
  window.cabinetSession = session;
  current = { ...DEMO.companies[0], id:session.company_id, ...session.company,
    name:session.company.name, note:[session.company.sector,session.company.city].filter(Boolean).join(' · '),
    balance:session.company.balance || 0, own:session.company.balance || 0, credit:session.company.credit || 0,
    deposit:session.company.deposit || 0, inn:'Демо', acc:'Демонстрационный счёт' };
  current.id = session.company_id;
  role = session.role;
  renderCompany();
  showView('home');
};

const copy = t => navigator.clipboard?.writeText(t).catch(() => {});
$('#copyNo').addEventListener('click', () => copy(current.acc.replace(/\s/g, '')));
$('#copyReq').addEventListener('click', () => copy(`${current.name}, ИНН ${current.inn}, р/с ${current.acc.replace(/\s/g, '')}, АО «Альфа-Банк», БИК 044525593`));

$('#burger').addEventListener('click', () => document.body.classList.add('side-open'));
$('#sideOverlay').addEventListener('click', () => document.body.classList.remove('side-open'));

const toggleChat = open => { $('#chat').classList.toggle('open', open); $('#fab').setAttribute('aria-expanded', open); if (open) $('#chatInput').focus(); };
$('#fab').addEventListener('click', () => toggleChat(!$('#chat').classList.contains('open')));
$('#chatClose').addEventListener('click', () => toggleChat(false));
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#chatInput').value.trim();
  if (!v) return;
  $('#chatBody').insertAdjacentHTML('beforeend', `<div class="bubble" style="align-self:flex-end;background:var(--fill);border-radius:14px 14px 4px 14px">${esc(v)}</div>`);
  $('#chatInput').value = '';
});

renderHome(); renderCompany();
</script>
</body>
</html>
