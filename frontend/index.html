<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Альфа-Бизнес</title>
<script>
// Apply before first paint; storage can be unavailable in a private browser.
try {
  const saved = localStorage.getItem('alfa-insights-theme');
  document.documentElement.dataset.theme = ['light', 'dark'].includes(saved) ? saved
    : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
} catch { document.documentElement.dataset.theme = 'light'; }
</script>

<!--
  Recreation of the current Alfa-Business web cabinet (2024 light redesign).
  Source: habr.com/ru/companies/alfa/articles/809991, screenshots in reference/.
  Company overview and analytical sections are rendered by src/main.jsx using the existing cabinet APIs.
  Run: npm ci && npm run dev   (static build: npm run build -> dist/)
-->
<style>
:root{
  --red:#EF3124; --red-dark:#D42A1E;
  --bg:#F3F4F5; --card:#FFFFFF; --fill:#EBECEF; --fill-hover:#E2E4E8;
  --text:#0B1F35; --text-2:#5E6C7B; --text-3:#97A0AB; --icon:#86909C;
  --line:#E1E3E6; --blue:#2A77EF; --green:#13A463; --green-bg:#E3F5EA; --purple:#7B61FF;
  --radius:16px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block;flex:0 0 auto}

body.cabinet-locked .app,body.cabinet-locked>.fab,body.cabinet-locked>.chat{display:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:266px;flex:0 0 266px;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  padding:14px 12px 12px;border-right:1px solid var(--line);background:var(--bg);z-index:30;
}
.logo{display:flex;align-items:center;gap:14px;padding:0 0 14px;font-size:19px;font-weight:700;letter-spacing:-.2px}
.logo-mark{position:relative;width:42px;height:42px;border-radius:13px;background:var(--red);display:grid;place-items:center;color:#fff}
.logo-mark svg{transition:opacity .15s,transform .15s}
.logo-mark .home{position:absolute;opacity:0;transform:scale(.6)}
.logo:hover .logo-mark .a{opacity:0;transform:scale(.6)}
.logo:hover .logo-mark .home{opacity:1;transform:none}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.nav-item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:46px;padding:0 12px;
  border-radius:12px;font-size:15px;color:var(--text);position:relative;transition:background .12s;white-space:nowrap;
}
.nav-item svg{color:var(--icon)}
.nav-item:hover{background:var(--fill)}
.nav-item.active{background:var(--fill)}
.nav-item.active::before{content:'';position:absolute;left:-4px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--red)}
.nav-item.primary{background:var(--card);font-weight:500;margin-bottom:6px}
.nav-item.primary svg{color:var(--text)}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:6px}
.nav-caption{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text);font-weight:500}
.nav-caption button{color:var(--icon)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.nav-promo svg{color:var(--icon);border:1.5px dashed #C7CCD3;border-radius:50%;padding:5px;width:34px;height:34px;margin-left:-7px;margin-right:-7px}
.side-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.side-tile{background:var(--card);border-radius:14px;padding:12px;text-align:left;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:10px;min-height:92px}
.side-tile:hover{background:#fff;box-shadow:0 2px 10px rgba(11,31,53,.08)}
.side-old{font-size:13px;color:var(--text-3);padding:12px 12px 0;text-align:left}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 32px 0 24px}
.top-btn.burger{display:none;margin-right:auto}
.top-btn{height:40px;min-width:40px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:8px;color:var(--text)}
.top-btn svg{color:#3B4A5A}
.top-btn:hover{background:var(--fill)}
.top-sep{width:1px;height:28px;background:var(--line);margin:0 10px}
.who{position:relative}
.who-btn{display:flex;align-items:center;gap:12px;padding:4px 10px;border-radius:12px;text-align:left}
.who-btn:hover{background:var(--fill)}
.who-btn b{display:block;font-size:15px;font-weight:600;white-space:nowrap}
.who-btn span{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:320px;background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(11,31,53,.18);padding:8px;display:none;z-index:60}
.menu.open{display:block}
.menu h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:10px 10px 6px}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px}
.menu-item:hover{background:var(--bg)}
.menu-item small{display:block;color:var(--text-3);font-size:12px}
.menu-item .tick{color:var(--red);font-weight:700;visibility:hidden}
.menu-item.on .tick{visibility:visible}

.content{padding:8px 32px 48px 32px;width:100%;max-width:1320px}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border-radius:var(--radius)}
.h-sys{font-size:40px;line-height:48px;font-weight:700;letter-spacing:-.6px;margin:8px 0 6px}
.h-sub{color:var(--text-2);margin-bottom:20px}

/* ---------- shared buttons ---------- */
.btn{height:44px;padding:0 22px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn-gray{background:var(--fill)}
.btn-gray:hover{background:var(--fill-hover)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-dark)}
.btn-text{padding:0 8px}

/* ---------- service page ---------- */
.mount{min-height:420px;padding:24px;border-radius:var(--radius);background:var(--card)}
.mount-empty{border:1.5px dashed #7FB0FF;background:#EEF4FF;border-radius:12px;min-height:372px;display:grid;place-items:center;color:var(--blue);text-align:center;padding:20px}

/* ---------- chat ---------- */
.fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(239,49,36,.38);z-index:50;transition:background .15s,transform .15s}
.fab:hover{background:var(--red-dark);transform:translateY(-1px)}
.chat{position:fixed;right:24px;bottom:96px;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 120px);background:var(--card);border-radius:20px;box-shadow:0 16px 48px rgba(11,31,53,.22);display:none;flex-direction:column;overflow:hidden;z-index:55}
.chat.open{display:flex}
.chat-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat-head b{font-size:16px}
.chat-head small{display:block;color:var(--text-2);font-size:12.5px}
#chatBody{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bubble{background:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;max-width:88%}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-input input{flex:1;height:44px;border-radius:12px;border:0;background:var(--bg);padding:0 14px;outline:none}

/* ---------- calendar ---------- */
.cal-wrap{max-width:880px}
.cal-card{padding:22px 26px 26px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.cal-title{font-size:19px;font-weight:700}
.cal-nav{display:flex;gap:6px}
.cal-nav button{height:38px;min-width:38px;padding:0 10px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--text)}
.cal-nav button:hover{background:var(--fill-hover)}
.cal-nav .cal-today{font-size:14px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);padding:4px 0 10px}
.cal-day{height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14.5px;font-variant-numeric:tabular-nums;gap:3px}
.cal-day:hover{background:var(--fill)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--red);color:var(--red);font-weight:600}
.cal-day.sel{background:var(--red);color:#fff}
.cal-day.sel:hover{background:var(--red-dark)}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--red)}
.cal-day.sel .cal-dot{background:#fff}
.cal-events{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.cal-events h3{font-size:15px;font-weight:600;margin-bottom:2px}
.cal-ev{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left}
.cal-ev .ev-date{flex:0 0 auto;text-align:center;min-width:44px;border-radius:10px;background:var(--card);padding:6px 8px;line-height:1.05}
.cal-ev .ev-date b{display:block;font-size:18px;font-weight:700;color:var(--red)}
.cal-ev .ev-date span{font-size:11px;color:var(--text-2);text-transform:capitalize}
.cal-ev .ev-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.cal-ev .ev-title{font-size:14.5px;font-weight:500;line-height:1.35}
.cal-ev .ev-meta{display:flex;flex-wrap:wrap;gap:6px}
.ev-chip{font-size:11.5px;font-weight:600;letter-spacing:.3px;padding:3px 8px;border-radius:6px;background:var(--card);color:var(--text-2)}
.ev-chip.st-high{background:var(--red);color:#fff}
.ev-chip.st-mid{background:var(--fill);color:var(--text)}
.cal-empty{color:var(--text-3);font-size:14px;padding:8px 2px}
@media (max-width:600px){.cal-card{padding:16px}.cal-day{height:42px;font-size:13.5px}}

.side-overlay{display:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .side{position:fixed;left:0;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.side-open .side{transform:none}
  body.side-open .side-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
  .top-btn.burger{display:flex}
  .top{padding:0 16px}
  .content{padding:8px 16px 96px}
  .top-hide,.top-sep{display:none}
}
@media (max-width:600px){
  .who-btn span{display:none}
  .h-sys{font-size:30px;line-height:36px}
}
</style>
</head>

<script>
const CABINET_USER = 'Смирнов И. В.';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null, role = 'cfo';

function showView(view) {
  if (!document.getElementById('view-' + view)) view = 'home';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.body.classList.remove('side-open');
  window.scrollTo(0, 0);
  window.dispatchEvent(new CustomEvent('demo:view', { detail: { view } }));
}
window.showView = showView;
document.addEventListener('click', e => {
  const tool = e.target.closest('[data-cabinet-tool]');
  if (tool) {
    e.preventDefault();
    document.body.classList.remove('side-open');
    window.dispatchEvent(new CustomEvent('cabinet:tool', {detail:{tool:tool.dataset.cabinetTool}}));
    return;
  }
  const t = e.target.closest('[data-view]');
  if (!t) return;
  e.preventDefault();
  showView(t.dataset.view, t.dataset.title);
});

function renderCompany() {
  if (!current) return;
  $('#whoCompany').textContent = current.name;
  $('#whoUser').textContent = `${CABINET_USER} · ${window.cabinetSession?.role_title || role}`;
  window.demoContext = { ...window.cabinetSession, company_meta:window.cabinetSession?.company, company:current.id, role };
  window.dispatchEvent(new CustomEvent('demo:context', { detail:window.demoContext }));
}

// Switch accounts through the same entry screen, keeping company and reader role together.
$('#whoBtn').addEventListener('click', () => window.dispatchEvent(new Event('cabinet:switcher')));
$('#cabinetLogout').addEventListener('click', () => window.dispatchEvent(new Event('cabinet:logout')));
window.setCabinetContext = session => {
  window.cabinetSession = session;
  current = { ...session.company, id:session.company_id };
  role = session.role;
  renderCompany();
  showView('home');
  calLoadMonth();
};

$('#burger').addEventListener('click', () => document.body.classList.add('side-open'));
$('#sideOverlay').addEventListener('click', () => document.body.classList.remove('side-open'));

$('#fab').addEventListener('click', () => window.dispatchEvent(new Event('cabinet:chat')));

// ---------- calendar: GET /v1/calendar by date range (SQLite index on the backend) ----------
const CAL_IMPACT = {high:['Высокое влияние','st-high'], mid:['Среднее влияние','st-mid'], low:['Низкое влияние','st-mid']};
const CAL_MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const CAL_MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let calCursor = new Date(), calSelected = null, calMonthEvents = [], calFailed = false;

const calKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const calByDate = () => {
  const map = {};
  for (const e of calMonthEvents) (map[e.event_date] = map[e.event_date] || []).push(e);
  return map;
};

async function calLoadMonth() {
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const last = new Date(y, m + 1, 0).getDate();
  const from = calKey(new Date(y, m, 1)), to = calKey(new Date(y, m, last));
  const company = window.cabinetSession?.company_id;
  const url = `/v1/calendar?from=${from}&to=${to}${company ? `&company_id=${encodeURIComponent(company)}` : ''}`;
  calMonthEvents = []; calFailed = false;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    calMonthEvents = (await r.json()).events || [];
  } catch { calFailed = true; }
  calRender();
}

function calRender() {
  const map = calByDate(), today = calKey(new Date());
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  $('#calTitle').textContent = `${CAL_MONTHS_NOM[m]} ${y}`;
  $('#calDow').innerHTML = ['пн','вт','ср','чт','пт','сб','вс'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  const shift = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < shift; i++) html += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const key = calKey(new Date(y, m, d)), has = !!map[key];
    html += `<button class="cal-day${key === today ? ' today' : ''}${key === calSelected ? ' sel' : ''}" data-date="${key}"
      aria-label="${d} ${CAL_MONTHS[m]}${has ? ', есть события' : ''}">${d}${has ? '<span class="cal-dot"></span>' : ''}</button>`;
  }
  $('#calDays').innerHTML = html;
  const list = calSelected ? (map[calSelected] || []) : [];
  const [sy, sm, sd] = (calSelected || today).split('-').map(Number);
  const head = `<h3>${sd} ${CAL_MONTHS[sm - 1]} ${sy}</h3>`;
  $('#calEvents').innerHTML = calFailed
    ? head + '<div class="cal-empty">Календарь событий недоступен без сервера анализа.</div>'
    : list.length ? head + list.map(e => {
        const [impactLabel, impactClass] = CAL_IMPACT[e.impact_level] || ['', ''];
        return `<div class="cal-ev">
          <div class="ev-date"><b>${sd}</b><span>${CAL_MONTHS[sm - 1]}</span></div>
          <div class="ev-body">
            <div class="ev-title">${esc(e.title)}</div>
            <div class="ev-meta">
              <span class="ev-chip">${esc(e.company_id)} · ${esc(e.role)}</span>
              ${impactLabel ? `<span class="ev-chip ${impactClass}">${impactLabel}</span>` : ''}
              ${e.channel ? `<span class="ev-chip">${esc(e.channel)}</span>` : ''}
            </div>
          </div></div>`; }).join('')
    : head + (calSelected ? '<div class="cal-empty">На эту дату событий нет.</div>'
        : '<div class="cal-empty">Выберите дату с красной точкой, чтобы увидеть события.</div>');
}

$('#calPrev').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth() - 1); calSelected = null; calLoadMonth(); });
$('#calNext').addEventListener('click', () => { calCursor.setMonth(calCursor.getMonth() + 1); calSelected = null; calLoadMonth(); });
$('#calToday').addEventListener('click', () => { calCursor = new Date(); calSelected = null; calLoadMonth(); });
$('#calDays').addEventListener('click', e => {
  const b = e.target.closest('[data-date]');
  if (!b) return;
  calSelected = calSelected === b.dataset.date ? null : b.dataset.date;
  calRender();
});
calLoadMonth();


</script>
</body>
</html>
