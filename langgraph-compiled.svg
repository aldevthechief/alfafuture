<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Segoe UI, Arial, sans-serif">
<rect width="980" height="620" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5c6673"/></marker></defs>
<text x="20" y="28" font-size="15" font-weight="500" fill="#1a2129">Скомпилированные графы LangGraph (из get_graph(): узлы и рёбра 1:1)</text>
<text x="20" y="52" font-size="12" fill="#5c6673">Подграф новостей — InsightPipeline.news_graph() (запускается внутри узла news_engine)</text><ellipse cx="105.0" cy="128" rx="45.0" ry="20" fill="none" stroke="#d4dae1"/><text x="105.0" y="132" text-anchor="middle" font-size="12" fill="#1a2129">__start__</text><rect x="200" y="80" width="130" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="265.0" y="103" text-anchor="middle" font-size="12.5" fill="#1a2129">assess_one</text><rect x="390" y="110" width="90" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="435.0" y="133" text-anchor="middle" font-size="12.5" fill="#1a2129">rank</text><rect x="530" y="80" width="120" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="590.0" y="103" text-anchor="middle" font-size="12.5" fill="#1a2129">judge_one</text><rect x="700" y="110" width="90" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="745.0" y="133" text-anchor="middle" font-size="12.5" fill="#1a2129">collect</text><ellipse cx="875.0" cy="128" rx="45.0" ry="20" fill="#bfb6fc" stroke="#d4dae1"/><text x="875.0" y="132" text-anchor="middle" font-size="12" fill="#1a2129">__end__</text><line x1="150" y1="128" x2="200" y2="128" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><text x="158" y="118" font-size="11" fill="#5c6673">Send ×N</text><line x1="330" y1="98" x2="390" y2="116" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="128" x2="530" y2="128" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="650" y1="98" x2="700" y2="116" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="790" y1="128" x2="830" y2="128" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><path d="M 105 90 C 160 40, 320 40, 395 92" fill="none" stroke="#5c6673" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="240" y="46" font-size="11" fill="#5c6673">пусто → rank</text><path d="M 480 146 C 560 190, 660 190, 716 146" fill="none" stroke="#5c6673" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="560" y="196" font-size="11" fill="#5c6673">топ пуст → collect</text><path d="M 460 90 C 480 60, 500 60, 522 82" fill="none" stroke="#5c6673" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="462" y="58" font-size="11" fill="#5c6673">Send ×top</text><text x="20" y="270" font-size="12" fill="#5c6673">E2E-граф — build_e2e_graph(with_analytics=True) — то, что запускает CLI (--engine judge, --source both)</text><ellipse cx="105.0" cy="348" rx="45.0" ry="20" fill="none" stroke="#d4dae1"/><text x="105.0" y="352" text-anchor="middle" font-size="12" fill="#1a2129">__start__</text><rect x="210" y="320" width="150" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="285.0" y="343" text-anchor="middle" font-size="12.5" fill="#1a2129">news_engine</text><rect x="210" y="410" width="130" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="275.0" y="433" text-anchor="middle" font-size="12.5" fill="#1a2129">analytics</text><rect x="450" y="365" width="100" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="500.0" y="388" text-anchor="middle" font-size="12.5" fill="#1a2129">merge</text><rect x="640" y="330" width="100" height="36" rx="9" fill="#eef2ff" stroke="#d4dae1"/><text x="690.0" y="353" text-anchor="middle" font-size="12.5" fill="#1a2129">save</text><ellipse cx="845.0" cy="348" rx="45.0" ry="20" fill="#bfb6fc" stroke="#d4dae1"/><text x="845.0" y="352" text-anchor="middle" font-size="12" fill="#1a2129">__end__</text><line x1="150" y1="348" x2="210" y2="348" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="150" y1="356" x2="205" y2="420" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="360" y1="348" x2="450" y2="370" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="340" y1="428" x2="450" y2="386" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="550" y1="383" x2="665" y2="350" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><line x1="740" y1="348" x2="800" y2="348" stroke="#5c6673" stroke-width="1.5" marker-end="url(#a)"/><text x="440" y="318" font-size="11" fill="#5c6673">параллельные ветки из __start__ (super-step)</text><text x="500" y="420" font-size="11" fill="#5c6673">join: новости v2 + квота аналитики</text><text x="20" y="500" font-size="11" fill="#5c6673">Пунктир = conditional edge (Send fan-out: по одной задаче на новость / на топ-новость; max_concurrency = --workers). Сплошные = обычные рёбра.</text><text x="20" y="520" font-size="11" fill="#5c6673">Состояние: rows → assessed(+reducer add) → top → judge_rows(+) → news_results(+); E2E: analytics/analytics_error → results → out.</text><text x="20" y="540" font-size="11" fill="#5c6673">news_engine внутри вызывает сабграф новостей (случай Send показан на верхней панели).</text></svg>