services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # the volume keeps every cached answer across restarts
    volumes:
      - redis-data:/data
  pipeline:
    build: .
    environment:
      ALFA_CACHE_REDIS_URL: redis://redis:6379/0
      CUDA_VISIBLE_DEVICES: "-1"
    volumes:
      - ./data:/app/data
      - ./common/llm/.env:/app/common/llm/.env:ro
    depends_on:
      - redis
  backend:
    build: .
    command: python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000
    environment:
      ALFA_CACHE_REDIS_URL: redis://redis:6379/0
      CUDA_VISIBLE_DEVICES: "-1"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./common/llm/.env:/app/common/llm/.env:ro
    depends_on:
      - redis
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  redis-data:
